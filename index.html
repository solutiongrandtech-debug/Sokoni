<style>
:root{--bg:#f1f1f2;--panel:#fff;--ink:#1c1c1e;--mute:#6b6b70;--line:#e2e2e5;--brand:#f47c20;--onbrand:#fff;--ok:#1b7f4c;--red:#d93025;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111214;--panel:#1b1c1f;--ink:#f0f0f2;--mute:#9a9aa0;--line:#2c2d31;--ok:#55c78a;--red:#ff7b70}}
:root[data-theme="dark"]{--bg:#111214;--panel:#1b1c1f;--ink:#f0f0f2;--mute:#9a9aa0;--line:#2c2d31;--ok:#55c78a;--red:#ff7b70}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 Manrope,system-ui,sans-serif}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--brand);color:var(--onbrand)}
.bar>div{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;gap:10px;align-items:center}
.logo{font-weight:800;font-size:1.3rem;letter-spacing:-.02em;background:none;border:0;color:var(--onbrand);padding:0}
.search{flex:1;padding:10px 14px;border:0;border-radius:6px;background:#fff;color:#1c1c1e;min-width:0}
#navr{display:flex;gap:4px;margin-left:auto}
.hb{background:transparent;border:0;color:var(--onbrand);font-weight:600;white-space:nowrap;padding:6px}
main{max-width:1180px;margin:0 auto;padding:16px 16px 60px}
h2{margin:8px 0 12px}h3{margin:6px 0}
.mute{color:var(--mute)}
:root{--sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--r-sm:8px;--r-md:12px;--sh-1:0 1px 3px rgba(0,0,0,.12);--sh-2:0 4px 18px rgba(0,0,0,.18)}.vp{margin:12px 0}.vp b{display:block;margin-bottom:6px}.vo{min-height:44px;min-width:44px;padding:0 14px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;cursor:pointer;margin:0 6px 6px 0}.vo[aria-pressed=true]{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand)}.cc{display:flex;gap:12px;overflow-x:auto;padding:12px 2px;scrollbar-width:none}.ccb{flex:0 0 auto;width:72px;min-height:44px;background:none;border:0;color:var(--ink);font:inherit;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer}.ccb span{width:56px;height:56px;border-radius:50%;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;font-size:26px}.ccb:active span{transform:scale(.94);transition:transform .15s}.lk{background:none;border:0;color:inherit;text-decoration:underline;font:inherit;min-height:44px;min-width:44px;padding:0 6px;cursor:pointer}#consent{position:fixed;left:12px;right:12px;bottom:calc(68px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:0 4px 18px rgba(0,0,0,.18);display:flex;gap:10px;align-items:center;flex-wrap:wrap;max-width:560px;margin:0 auto;font-size:14px}#consent button{min-height:44px;padding:0 16px;border-radius:8px;border:1px solid var(--line);background:var(--brand);color:var(--onbrand);font:inherit;font-weight:600;cursor:pointer}#consent .lk{background:none;color:inherit;border:0}.flash{background:color-mix(in srgb,var(--brand) 16%,var(--panel));border-left:4px solid var(--brand);padding:10px 14px;border-radius:6px;margin-bottom:12px}
.hero{background:linear-gradient(100deg,var(--brand),var(--brand2,color-mix(in srgb,var(--brand) 60%,#fff)));color:var(--onbrand);border-radius:8px;padding:20px 22px;margin-bottom:14px}
.hero h1{margin:0 0 4px;font-size:clamp(1.3rem,4vw,1.9rem)}.hero p{margin:0}
.lay{display:grid;grid-template-columns:190px 1fr;gap:16px}
.side{background:var(--panel);border-radius:8px;padding:8px;align-self:start}
.side button{display:block;width:100%;text-align:left;background:none;border:0;padding:9px 10px;border-radius:6px}
.side button[aria-pressed="true"]{background:color-mix(in srgb,var(--brand) 16%,transparent);font-weight:600;color:var(--brand-ink,var(--brand))}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.card{background:var(--panel);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:3px;position:relative}
.img{aspect-ratio:1;border-radius:6px;display:grid;place-items:center;font-size:3rem}

e="code" value="${esc(CO.code||'')}" maxlength="10" placeholder="e.g. QGH7XK2LMN" autocapitalize="characters" style="text-transform:uppercase"></label>`:'')+(PF?'':`<label class="opt"><input type="radio" name="pay" value="pod" ${CO.pay==='pod'?'checked':''}><span>Pay on delivery<small>Cash or M-Pesa</small></span></label>`);

const SETUP_SQL="-- Evansness marketplace: Supabase schema (run once in Dashboard > SQL Editor)\n-- Safe to re-run: uses IF NOT EXISTS / OR REPLACE where possible.\n\ncreate extension if not exists pgcrypto;\n\ndo $$ begin\n  create type public.user_role as enum ('customer','retailer','admin','finance','logistics');\nexception when duplicate_object then null; end $$;\n\n-- ───────── Tables ─────────\ncreate table if not exists public.profiles (\n  id uuid primary key references auth.users(id) on delete cascade,\n  role public.user_role not null default 'customer',\n  approved boolean not null default false,        -- retailers need admin approval\n  name text, phone text, email text,\n  id_number text, county text, subcounty text, ward text, location text, landmark text,\n  shop_name text, accent text,\n  created_at timestamptz not null default now()\n);\n\ncreate table if not exists public.products (\n  id uuid primary key default gen_random_uuid(),\n  seller_id uuid not null references public.profiles(id) on delete cascade,\n  name text not null, category text not null,\n  price int not null check (price >= 0), old_price int,\n  stock int not null default 0 check (stock >= 0),\n  emoji text, description text, brand text, warranty text,\n  images text[] not null default '{}',\n  highlights text[] not null default '{}',\n  specs jsonb not null default '[]',\n  options jsonb not null default '[]',            -- [{\"n\":\"Size\",\"o\":[\"S\",\"M\"]}]\n  hidden boolean not null default false,\n  created_at timestamptz not null default now()\n);\n\ncreate table if not exists public.orders (\n  id bigint generated always as identity (start with 100001) primary key,   -- shown as EV-<id>\n  customer_id uuid not null references public.profiles(id),\n  name text, phone text,\n  subtotal int not null default 0, fee int not null default 0, total int not null default 0,\n  method text check (method in ('door','pickup')),\n  county text, address text,\n  pay text check (pay in ('mpesa','pod','card')),\n  mpesa_code text,\n  payment_status text not null default 'pending' check (payment_status in ('pending','approved','rejected')),\n  status text not null default 'Placed' check (status in ('Placed','Packed','Dispatched','Delivered')),\n  rider text,\n  created_at timestamptz not null default now()\n);\n\ncreate table if not exists public.order_lines (\n  id bigint generated always as identity primary key,\n  order_id bigint not null references public.orders(id) on delete cascade,\n  product_id uuid references public.products(id) on delete set null,\n  seller_id uuid not null references public.profiles(id),\n  name text not null, qty int not null check (qty > 0), price int not null\n);\n\ncreate table if not exists public.reviews (\n  id bigint generated always as identity primary key,\n  product_id uuid not null references public.products(id) on delete cascade,\n  user_id uuid not null references public.profiles(id) on delete cascade,\n  author text, stars int not null check (stars between 1 and 5), body text,\n  created_at timestamptz not null default now(),\n  unique (product_id, user_id)\n);\n\ncreate table if not exists public.addresses (\n  id uuid primary key default gen_random_uuid(),\n  user_id uuid not null references public.profiles(id) on delete cascade,\n  label text not null, county text, subcounty text, ward text, location text, landmark text,\n  created_at timestamptz not null default now()\n);\n\ncreate table if not exists public.payouts (\n  id bigint generated always as identity primary key,\n  seller_id uuid not null references public.profiles(id),\n  amount int not null check (amount >= 0),\n  status text not null default 'pending' check (status in ('pending','paid')),\n  created_at timestamptz not null default now()\n);\n\ncreate table if not exists public.messages (\n  id bigint generated always as identity primary key,\n  from_id uuid not null references public.profiles(id) on delete cascade,\n  to_id uuid not null references public.profiles(id) on delete cascade,\n  product_id uuid references public.products(id) on delete set null,\n  body text not null check (length(body) <= 1000),\n  created_at timestamptz not null default now()\n);\n\ncreate index if not exists products_seller_idx on public.products(seller_id);\ncreate index if not exists order_lines_order_idx on public.order_lines(order_id);\ncreate index if not exists order_lines_seller_idx on public.order_lines(seller_id);\ncreate index if not exists reviews_product_idx on public.reviews(product_id);\n\n-- ───────── Helper functions (SECURITY DEFINER avoids RLS recursion) ─────────\ncreate or replace function public.my_role() returns public.user_role\nlanguage sql stable security definer set search_path = public as\n$$ select role from public.profiles where id = auth.uid() $$;\n\ncreate or replace function public.is_staff() returns boolean\nlanguage sql stable security definer set search_path = public as\n$$ select coalesce(public.my_role() in ('admin','finance','logistics'), false) $$;\n\ncreate or replace function public.seller_approved(uid uuid) returns boolean\nlanguage sql stable security definer set search_path = public as\n$$ select coalesce((select approved and role = 'retailer' from public.profiles where id = uid), false) $$;\n\ncreate or replace function public.owns_order(o bigint) returns boolean\nlanguage sql stable security definer set search_path = public as\n$$ select exists (select 1 from public.orders where id = o and customer_id = auth.uid()) $$;\n\ncreate or replace function public.sells_in_order(o bigint) returns boolean\nlanguage sql stable security definer set search_path = public as\n$$ select exists (select 1 from public.order_lines where order_id = o and seller_id = auth.uid()) $$;\n\n-- ───────── New user -> profile (role can only be customer or retailer at sign-up) ─────────\ncreate or replace function public.handle_new_user() returns trigger\nlanguage plpgsql security definer set search_path = public as $$\ndeclare r public.user_role := case when new.raw_user_meta_data->>'role' = 'retailer' then 'retailer' else 'customer' end;\nbegin\n  insert into public.profiles (id, role, approved, name, phone, email, shop_name)\n  values (new.id, r, (r = 'customer'), new.raw_user_meta_data->>'name', new.raw_user_meta_data->>'phone',\n          new.email, new.raw_user_meta_data->>'shop_name');\n  return new;\nend $$;\ndrop trigger if exists on_auth_user_created on auth.users;\ncreate trigger on_auth_user_created after insert on auth.users\n  for each row execute function public.handle_new_user();\n\n-- Review author comes from the profile, not the client\ncreate or replace function public.set_review_author() returns trigger\nlanguage plpgsql security definer set search_path = public as $$\nbegin\n  new.author := coalesce((select name from public.profiles where id = new.user_id), 'Customer');\n  return new;\nend $$;\ndrop trigger if exists reviews_author on public.reviews;\ncreate trigger reviews_author before insert on public.reviews\n  for each row execute function public.set_review_author();\n\n-- ───────── Public shop names (no private profile data) ─────────\ncreate or replace view public.shops as\n  select id, shop_name from public.profiles where role = 'retailer' and approved;\ngrant select on public.shops to anon, authenticated;\n\n-- ───────── Row level security ─────────\nalter table public.profiles    enable row level security;\nalter table public.products    enable row level security;\nalter table public.orders      enable row level security;\nalter table public.order_lines enable row level security;\nalter table public.reviews     enable row level security;\nalter table public.addresses   enable row level security;\nalter table public.payouts     enable row level security;\nalter table public.messages    enable row level security;\n\n-- profiles: see/edit only your own (staff can read all). Role and approval are never client-editable.\ndrop policy if exists profiles_select on public.profiles;\ncreate policy profiles_select on public.profiles for select to authenticated\n  using (id = auth.uid() or public.is_staff());\ndrop policy if exists profiles_update on public.profiles;\ncreate policy profiles_update on public.profiles for update to authenticated\n  using (id = auth.uid()) with check (id = auth.uid());\nrevoke insert, delete on public.profiles from anon, authenticated;\nrevoke update on public.profiles from anon, authenticated;\ngrant update (name, phone, id_number, county, subcounty, ward, location, landmark, shop_name, accent)\n  on public.profiles to authenticated;\n\n-- products\ndrop policy if exists products_select on public.products;\ncreate policy products_select on public.products for select to anon, authenticated\n  using ((not hidden and public.seller_approved(seller_id)) or seller_id = auth.uid() or public.my_role() = 'admin');\ndrop policy if exists products_insert on public.products;\ncreate policy products_insert on public.products for insert to authenticated\n  with check (seller_id = auth.uid() and public.my_role() = 'retailer' and public.seller_approved(auth.uid()));\ndrop policy if exists products_update on public.products;\ncreate policy products_update on public.products for update to authenticated\n  using (seller_id = auth.uid() or public.my_role() = 'admin')\n  with check (seller_id = auth.uid() or public.my_role() = 'admin');\ndrop policy if exists products_delete on public.products;\ncreate policy products_delete on public.products for delete to authenticated\n  using (seller_id = auth.uid() or public.my_role() = 'admin');\n\n-- orders and lines: written only through place_order(); read by owner, seller of a line, or staff\ndrop policy if exists orders_select on public.orders;\ncreate policy orders_select on public.orders for select to authenticated\n  using (customer_id = auth.uid() or public.is_staff() or public.sells_in_order(id));\ndrop policy if exists lines_select on public.order_lines;\ncreate policy lines_select on public.order_lines for select to authenticated\n  using (seller_id = auth.uid() or public.is_staff() or public.owns_order(order_id));\nrevoke insert, update, delete on public.orders, public.order_lines from anon, authenticated;\n\n-- reviews: public read; only buyers of a delivered order can review, once per product\ndrop policy if exists reviews_select on public.reviews;\ncreate policy reviews_select on public.reviews for select to anon, authenticated using (true);\ndrop policy if exists reviews_insert on public.reviews;\ncreate policy reviews_insert on public.reviews for insert to authenticated\n  with check (user_id = auth.uid() and exists (\n    select 1 from public.order_lines ol join public.orders o on o.id = ol.order_id\n    where ol.product_id = reviews.product_id and o.customer_id = auth.uid() and o.status = 'Delivered'));\ndrop policy if exists reviews_delete on public.reviews;\ncreate policy reviews_delete on public.reviews for delete to authenticated\n  using (user_id = auth.uid() or public.my_role() = 'admin');\n\n-- address book\ndrop policy if exists addresses_all on public.addresses;\ncreate policy addresses_all on public.addresses for all to authenticated\n  using (user_id = auth.uid()) with check (user_id = auth.uid());\n\n-- payouts: seller reads own; finance/admin manage\ndrop policy if exists payouts_select on public.payouts;\ncreate policy payouts_select on public.payouts for select to authenticated\n  using (seller_id = auth.uid() or public.my_role() in ('admin','finance'));\ndrop policy if exists payouts_write on public.payouts;\ncreate policy payouts_write on public.payouts for all to authenticated\n  using (public.my_role() in ('admin','finance')) with check (public.my_role() in ('admin','finance'));\n\n-- messages: participants only\ndrop policy if exists messages_select on public.messages;\ncreate policy messages_select on public.messages for select to authenticated\n  using (from_id = auth.uid() or to_id = auth.uid());\ndrop policy if exists messages_insert on public.messages;\ncreate policy messages_insert on public.messages for insert to authenticated\n  with check (from_id = auth.uid());\n\n-- ───────── Server-side actions ─────────\n-- Place an order. Prices and stock come from the database, never from the browser.\n-- NOTE: p_fee is taken from the page; move your delivery-fee rules here before launch.\ncreate or replace function public.place_order(\n  p_lines jsonb, p_method text, p_county text, p_address text,\n  p_pay text, p_code text, p_fee int\n) returns bigint language plpgsql security definer set search_path = public as $$\ndeclare\n  v_uid uuid := auth.uid(); prof public.profiles%rowtype; pr public.products%rowtype;\n  v_order bigint; v_sub int := 0; l jsonb; v_qty int;\nbegin\n  if v_uid is null then raise exception 'Sign in required'; end if;\n  select * into prof from public.profiles where id = v_uid;\n  if prof.role <> 'customer' then raise exception 'Customers only'; end if;\n  if jsonb_array_length(p_lines) = 0 then raise exception 'Cart is empty'; end if;\n\n  insert into public.orders (customer_id, name, phone, fee, method, county, address, pay, mpesa_code, payment_status)\n  values (v_uid, prof.name, prof.phone, greatest(coalesce(p_fee,0),0), p_method, p_county, p_address,\n          p_pay, p_code, case when p_pay = 'mpesa' then 'pending' else 'approved' end)\n  returning id into v_order;\n\n  for l in select value from jsonb_array_elements(p_lines) loop\n    v_qty := (l->>'qty')::int;\n    if v_qty is null or v_qty <= 0 then raise exception 'Bad quantity'; end if;\n    select * into pr from public.products where id = (l->>'product_id')::uuid and not hidden for update;\n    if not found or not public.seller_approved(pr.seller_id) then raise exception 'Product unavailable'; end if;\n    if pr.stock < v_qty then raise exception 'Not enough stock for %', pr.name; end if;\n    update public.products set stock = stock - v_qty where id = pr.id;\n    insert into public.order_lines (order_id, product_id, seller_id, name, qty, price)\n    values (v_order, pr.id, pr.seller_id, pr.name || coalesce(' (' || nullif(l->>'options','') || ')', ''), v_qty, pr.price);\n    v_sub := v_sub + pr.price * v_qty;\n  end loop;\n  if p_pay <> 'mpesa' and v_sub + greatest(coalesce(p_fee,0),0) > 5000 then raise exception 'Orders above KSh 5,000 must be paid by M-Pesa first'; end if;\n\n  update public.orders set subtotal = v_sub, total = v_sub + fee where id = v_order;\n  return v_order;\nend $$;\nrevoke all on function public.place_order(jsonb,text,text,text,text,text,int) from public, anon;\ngrant execute on function public.place_order(jsonb,text,text,text,text,text,int) to authenticated;\n\ncreate or replace function public.set_order_status(p_order bigint, p_status text) returns void\nlanguage plpgsql security definer set search_path = public as $$\nbegin\n  if p_status not in ('Placed','Packed','Dispatched','Delivered') then raise exception 'Bad status'; end if;\n  if p_status <> 'Placed' and exists (select 1 from public.orders where id = p_order and payment_status <> 'approved') then raise exception 'Payment not confirmed yet'; end if;\n  if public.my_role() in ('admin','logistics')\n     or (public.my_role() = 'retailer' and public.sells_in_order(p_order)) then\n    update public.orders set status = p_status where id = p_order;\n  else raise exception 'Not allowed'; end if;\nend $$;\n\ncreate or replace function public.set_payment_status(p_order bigint, p_status text) returns void\nlanguage plpgsql security definer set search_path = public as $$\nbegin\n  if p_status not in ('pending','approved','rejected') then raise exception 'Bad status'; end if;\n  if public.my_role() not in ('admin','finance') then raise exception 'Not allowed'; end if;\n  update public.orders set payment_status = p_status where id = p_order;\nend $$;\n\ncreate or replace function public.admin_set_user(p_user uuid, p_role public.user_role, p_approved boolean) returns void\nlanguage plpgsql security definer set search_path = public as $$\nbegin\n  if public.my_role() <> 'admin' then raise exception 'Not allowed'; end if;\n  update public.profiles set role = p_role, approved = p_approved where id = p_user;\nend $$;\n\nrevoke all on function public.set_order_status(bigint,text), public.set_payment_status(bigint,text),\n  public.admin_set_user(uuid,public.user_role,boolean) from public, anon;\ngrant execute on function public.set_order_status(bigint,text), public.set_payment_status(bigint,text),\n  public.admin_set_user(uuid,public.user_role,boolean) to authenticated;\n\n-- ───────── Storage: product photos (public read, sellers write to their own folder) ─────────\ninsert into storage.buckets (id, name, public) values ('product-images', 'product-images', true)\non conflict (id) do nothing;\n\ndrop policy if exists \"product images public read\" on storage.objects;\ncreate policy \"product images public read\" on storage.objects for select\n  using (bucket_id = 'product-images');\ndrop policy if exists \"product images seller upload\" on storage.objects;\ncreate policy \"product images seller upload\" on storage.objects for insert to authenticated\n  with check (bucket_id = 'product-images' and (storage.foldername(name))[1] = auth.uid()::text\n              and public.my_role() = 'retailer');\ndrop policy if exists \"product images seller modify\" on storage.objects;\ncreate policy \"product images seller modify\" on storage.objects for update to authenticated\n  using (bucket_id = 'product-images' and (storage.foldername(name))[1] = auth.uid()::text);\ndrop policy if exists \"product images seller delete\" on storage.objects;\ncreate policy \"product images seller delete\" on storage.objects for delete to authenticated\n  using (bucket_id = 'product-images' and (storage.foldername(name))[1] = auth.uid()::text);\n\n-- ───────── After you sign up in the app, make yourself the first admin ─────────\n-- update public.profiles set role = 'admin', approved = true where email = 'YOUR_EMAIL_HERE';\n\n-- Evansness: storage buckets and KYC (run AFTER everness-supabase-schema.sql, in SQL Editor)\n-- Creates all buckets automatically. Safe to re-run.\n--\n-- File path convention used by the page:  <user-id>/<file-name>\n--   product-images/<seller-id>/<product-id>-1.jpg\n--   kyc-documents/<user-id>/national_id-<timestamp>.pdf\n\n-- ───────── Buckets ─────────\ninsert into storage.buckets (id, name, public, file_size_limit, allowed_mime_types) values\n  ('product-images', 'product-images', true,  5242880, array['image/jpeg','image/png','image/webp']),\n  ('shop-assets',    'shop-assets',    true,  3145728, array['image/jpeg','image/png','image/webp']),\n  ('review-photos',  'review-photos',  true,  4194304, array['image/jpeg','image/png','image/webp']),\n  ('kyc-documents',  'kyc-documents',  false, 8388608, array['image/jpeg','image/png','application/pdf'])\non conflict (id) do update set\n  public = excluded.public,\n  file_size_limit = excluded.file_size_limit,\n  allowed_mime_types = excluded.allowed_mime_types;\n\n-- ───────── shop-assets (logos, banners): public read, approved sellers write to own folder ─────────\ndrop policy if exists \"shop assets read\" on storage.objects;\ncreate policy \"shop assets read\" on storage.objects for select using (bucket_id = 'shop-assets');\ndrop policy if exists \"shop assets write\" on storage.objects;\ncreate policy \"shop assets write\" on storage.objects for insert to authenticated\n  with check (bucket_id = 'shop-assets' and (storage.foldername(name))[1] = auth.uid()::text\n              and public.my_role() = 'retailer');\ndrop policy if exists \"shop assets modify\" on storage.objects;\ncreate policy \"shop assets modify\" on storage.objects for update to authenticated\n  using (bucket_id = 'shop-assets' and (storage.foldername(name))[1] = auth.uid()::text);\ndrop policy if exists \"shop assets delete\" on storage.objects;\ncreate policy \"shop assets delete\" on storage.objects for delete to authenticated\n  using (bucket_id = 'shop-assets' and (storage.foldername(name))[1] = auth.uid()::text);\n\n-- ───────── review-photos: public read, any signed-in user writes to own folder ─────────\ndrop policy if exists \"review photos read\" on storage.objects;\ncreate policy \"review photos read\" on storage.objects for select using (bucket_id = 'review-photos');\ndrop policy if exists \"review photos write\" on storage.objects;\ncreate policy \"review photos write\" on storage.objects for insert to authenticated\n  with check (bucket_id = 'review-photos' and (storage.foldername(name))[1] = auth.uid()::text);\ndrop policy if exists \"review photos delete\" on storage.objects;\ncreate policy \"review photos delete\" on storage.objects for delete to authenticated\n  using (bucket_id = 'review-photos' and ((storage.foldername(name))[1] = auth.uid()::text or public.my_role() = 'admin'));\n\n-- ───────── kyc-documents: PRIVATE. Owner uploads and reads own files; admin reads and deletes all ─────────\ndrop policy if exists \"kyc upload own\" on storage.objects;\ncreate policy \"kyc upload own\" on storage.objects for insert to authenticated\n  with check (bucket_id = 'kyc-documents' and (storage.foldername(name))[1] = auth.uid()::text);\ndrop policy if exists \"kyc read own or admin\" on storage.objects;\ncreate policy \"kyc read own or admin\" on storage.objects for select to authenticated\n  using (bucket_id = 'kyc-documents'\n         and ((storage.foldername(name))[1] = auth.uid()::text or public.my_role() = 'admin'));\ndrop policy if exists \"kyc admin delete\" on storage.objects;\ncreate policy \"kyc admin delete\" on storage.objects for delete to authenticated\n  using (bucket_id = 'kyc-documents' and public.my_role() = 'admin');\n\n-- ───────── KYC records: one row per uploaded document ─────────\ncreate table if not exists public.kyc_documents (\n  id uuid primary key default gen_random_uuid(),\n  user_id uuid not null references public.profiles(id) on delete cascade,\n  doc_type text not null check (doc_type in\n    ('national_id','passport','business_registration','kra_pin','bank_or_mpesa_proof')),\n  file_path text not null,\n  status text not null default 'pending' check (status in ('pending','approved','rejected')),\n  note text,\n  reviewed_by uuid references public.profiles(id),\n  reviewed_at timestamptz,\n  created_at timestamptz not null default now(),\n  check (split_part(file_path, '/', 1) = user_id::text)\n);\ncreate index if not exists kyc_user_idx on public.kyc_documents(user_id);\nalter table public.kyc_documents enable row level security;\n\ndrop policy if exists kyc_select on public.kyc_documents;\ncreate policy kyc_select on public.kyc_documents for select to authenticated\n  using (user_id = auth.uid() or public.my_role() = 'admin');\ndrop policy if exists kyc_insert on public.kyc_documents;\ncreate policy kyc_insert on public.kyc_documents for insert to authenticated\n  with check (user_id = auth.uid() and status = 'pending');\nrevoke update, delete on public.kyc_documents from anon, authenticated;\n\n-- Admin decision on one document\ncreate or replace function public.review_kyc(p_doc uuid, p_status text, p_note text default null)\nreturns void language plpgsql security definer set search_path = public as $$\nbegin\n  if public.my_role() <> 'admin' then raise exception 'Not allowed'; end if;\n  if p_status not in ('approved','rejected') then raise exception 'Bad status'; end if;\n  update public.kyc_documents\n     set status = p_status, note = p_note, reviewed_by = auth.uid(), reviewed_at = now()\n   where id = p_doc;\nend $$;\nrevoke all on function public.review_kyc(uuid, text, text) from public, anon;\ngrant execute on function public.review_kyc(uuid, text, text) to authenticated;\n\n-- Automatic seller approval: once ID, business registration and KRA PIN are all approved\ncreate or replace function public.kyc_auto_approve() returns trigger\nlanguage plpgsql security definer set search_path = public as $$\nbegin\n  if (select role from public.profiles where id = new.user_id) = 'retailer'\n     and (select count(distinct doc_type) from public.kyc_documents\n           where user_id = new.user_id and status = 'approved'\n             and doc_type in ('national_id','business_registration','kra_pin')) = 3\n  then\n    update public.profiles set approved = true where id = new.user_id;\n  end if;\n  return new;\nend $$;\ndrop trigger if exists kyc_approved on public.kyc_documents;\ncreate trigger kyc_approved after update of status on public.kyc_documents\n  for each row when (new.status = 'approved') execute function public.kyc_auto_approve();\n\n-- Evansness: one account per national ID number (run after 001 and 002; safe to re-run)\n\n-- Only digits, 7 to 9 long (matches the page's check)\ndo $$ begin\n  alter table public.profiles add constraint profiles_id_number_format\n    check (id_number is null or id_number = '' or id_number ~ '^[0-9]{7,9}$');\nexception when duplicate_object then null; end $$;\n\n-- No two profiles may share an ID number\ncreate unique index if not exists profiles_id_number_key\n  on public.profiles (id_number) where id_number is not null and id_number <> '';\n\n-- Pre-check used by sign-up: true if another account already has this ID number.\n-- Returns only yes/no, never who owns it.\ncreate or replace function public.id_number_taken(p_id text) returns boolean\nlanguage sql stable security definer set search_path = public as $$\n  select exists (\n    select 1 from public.profiles\n     where id_number = p_id\n       and id <> coalesce(auth.uid(), '00000000-0000-0000-0000-000000000000'::uuid)\n  )\n$$;\ngrant execute on function public.id_number_taken(text) to anon, authenticated;\n";

VIEWS.otp=()=>OTPS.step===1?'<h2>Sign in with email code</h2><div class="box"><p class="mute">We email you a 6-digit code. No password needed. New emails get a customer account.</p><form class="form" data-f="otpsend" novalidate><label>Email<input name="email" type="email" required autocomplete="email" inputmode="email"></label>'+(OTPS.msg?'<div class="err" role="alert">'+esc(OTPS.msg)+'</div>':'')+'<button class="btn">Send code</button></form></div>':'<h2>Enter your code</h2><div class="box"><p class="mute">We sent a 6-digit code to <b>'+esc(OTPS.email)+'</b>. It expires in a few minutes.</p><form class="form" data-f="otpverify" novalidate><label>Code<input name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required style="letter-spacing:.4em;font-size:22px;text-align:center"></label>'+(OTPS.msg?'<div class="err" role="alert">'+esc(OTPS.msg)+'</div>':'')+'<button class="btn">Verify and sign in</button></form><div class="row" style="gap:8px;margin-top:10px"><button class="sb ghost" style="min-height:44px" data-act="otpresend">Resend code</button><button class="sb ghost" style="min-height:44px" data-act="otpback">Use another email</button></div></div>';
FORM.otpsend=async d=>{const em=(d.get('email')||'').trim().toLowerCase();if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){OTPS.msg='Enter a valid email address.';return render()}OTPS.msg='Sending...';render();const r=await sbAuth('otp',{email:em,create_user:true});if(r.ok){OTPS={step:2,email:em,msg:'',last:Date.now()}}else OTPS.msg=otpErr(r);render()};
FORM.otpverify=async d=>{const c=(d.get('code')||'').replace(/\D/g,'');if(c.length!==6){OTPS.msg='Enter the 6-digit code.';return render()}OTPS.msg='Checking...';render();const r=await sbAuth('verify',{type:'email',email:OTPS.email,token:c});if(!(r.ok&&r.j.access_token)){OTPS.msg=r.st===0||r.st===429?otpErr(r):'That code is wrong or has expired.';return render()}SBSESS={at:r.j.access_token,rt:r.j.refresh_token};const em=OTPS.email;let u=S.users.find(x=>(x.email||'').toLowerCase()===em);if(!u){u={id:'u'+uid(),role:'customer',name:em.split('@')[0],email:em,h:'',mustChange:false};S.users.push(u)}S.me=u.id;SESS=false;OTPS={step:1,email:'',msg:'',last:0};LASTACT=Date.now();save();after()};

/* ===== v12: empty cart, Back button, phone Back key ===== */
(function(){
/* ---- empty cart (cart page; the mini cart button is in its template) ---- */
const _cv=VIEWS.cart;
VIEWS.cart=function(){const h=_cv.apply(this,arguments);if(h.indexOf('data-act="checkout"')<0)return h;const i=h.lastIndexOf('</div>');return h.slice(0,i)+sb('emptycart','','Empty cart','ghost')+h.slice(i)};
ACT.emptycart=()=>{const saved=Object.assign({},S.cart),n=Object.values(saved).reduce((a,q)=>a+(Number(q)||0),0);if(!n)return;
 if(!confirm('Remove all '+n+' item'+(n===1?'':'s')+' from your cart?'))return;
 S.cart={};promo='';save();if(typeof closeMini==='function')closeMini();render();
 snack('Cart emptied','Undo',()=>{S.cart=saved;save();render()})};

/* ---- Back button: in-app history that also drives the phone Back key ---- */
const NAV={st:[],i:-1,me:null,sid:String(Date.now()),skip:0};
const snapN=()=>({V,TAB,PID,SID,CHAT,OID,cat,PTAB,AUTH});
const keyN=o=>JSON.stringify(o);
function updBack(){
 document.querySelectorAll('.bkr').forEach(x=>x.remove());if(NAV.i<1)return;
 const host=document.querySelector('#app .app .pg')||document.querySelector('#app');if(!host)return;
 host.insertAdjacentHTML('afterbegin','<div class="bkr"><button type="button" class="bkb" data-act="navback" aria-label="Go back"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M12.5 4.5L7 10l5.5 5.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Back</span></button></div>')}
function navTrack(){
 if(NAV.skip)return;
 const me=S.me||'',cur=snapN();
 if(NAV.i<0||NAV.me!==me){NAV.me=me;NAV.st=[cur];NAV.i=0;NAV.sid=String(Date.now());try{history.replaceState({nav:0,sid:NAV.sid},'')}catch(e){}updBack();return}
 if(keyN(NAV.st[NAV.i])===keyN(cur)){if(!document.querySelector('.bkr'))updBack();return}
 NAV.st=NAV.st.slice(0,NAV.i+1);NAV.st.push(cur);NAV.i++;try{history.pushState({nav:NAV.i,sid:NAV.sid},'')}catch(e){}updBack()}
const _r=render;render=function(){const r=_r.apply(this,arguments);try{navTrack()}catch(e){console.warn(e)}return r};
const overlay=()=>!!(document.getElementById('mdl')||document.body.classList.contains('mopen')||(typeof MINI!=='undefined'&&MINI)||(typeof MENU!=='undefined'&&MENU));
const closeOv=()=>{try{Mdl.close()}catch(e){}document.body.classList.remove('mopen');try{if(typeof MINI!=='undefined'&&MINI)closeMini()}catch(e){}try{if(typeof MENU!=='undefined'&&MENU)closeMenu()}catch(e){}};
function restore(t){NAV.skip=1;try{V=t.V;TAB=t.TAB;PID=t.PID;SID=t.SID;CHAT=t.CHAT;OID=t.OID;cat=t.cat;PTAB=t.PTAB;AUTH=t.AUTH;window.scrollTo(0,0);render()}finally{NAV.skip=0}updBack()}
addEventListener('popstate',e=>{
 const s=e.state;if(!s||typeof s.nav!=='number')return;
 if(s.sid!==NAV.sid){history.back();return}
 if(overlay()){closeOv();history.go(s.nav<NAV.i?1:s.nav>NAV.i?-1:0);return}
 if(s.nav===NAV.i||!NAV.st[s.nav])return;
 NAV.i=s.nav;restore(NAV.st[s.nav])});
ACT.navback=()=>{if(overlay()){closeOv();return}if(NAV.i>0)history.back()};
addEventListener('keydown',e=>{if(e.key==='Escape'&&!overlay()&&NAV.i>0&&!/INPUT|TEXTAREA|SELECT/.test((document.activeElement||{}).tagName||''))void 0});

.bkb{display:inline-flex;align-items:center;gap:4px;min-height:44px;padding:0 18px 0 10px;border-radius:999px;border:1px solid #d6dfd9;background:#fff;color:#10231a;font:700 14px Manrope,system-ui,sans-serif;cursor:pointer;box-shadow:0 8px 18px -14px rgba(16,35,26,.6);transition:transform .15s,background .15s,box-shadow .2s;animation:kin .35s both}
.bkb svg{width:20px;height:20px;transition:transform .2s}.bkb:hover{background:#f1f7f3}.bkb:hover svg{transform:translateX(-3px)}.bkb:active{transform:scale(.96)}
.bkb:focus-visible{outline:3px solid #158043;outline-offset:2px}
#app>.bkr{padding-left:14px;padding-right:14px}
body.quiet .bkb{animation:none}
@media(prefers-reduced-motion:reduce){.bkb{animation:none;transition:none}}
`;document.head.appendChild(css);
setTimeout(()=>{try{navTrack()}catch(e){}},400);
})();

/* ===== v13: dispatch with the rider shown in the list ===== */
(function(){const _d=ACT.dispatch;if(!_d)return;ACT.dispatch=function(id){const o=S.orders.find(x=>x.id===id);if(o&&!o.rider){const sel=document.querySelector('select[data-rider="'+id+'"]');o.rider=(sel&&sel.value)||riderNames()[0]||''}return _d.apply(this,arguments)}})();
