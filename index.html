.pop b{font-size:13px}
.swt{width:26px;height:26px;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line)}
input[type=color]{padding:0;width:34px;height:28px;border:0;background:none}
.auth{display:grid;grid-template-columns:5fr 6fr;max-width:920px;margin:16px auto;border-radius:14px;overflow:hidden;background:var(--panel)}
.aside{background:var(--brand);color:var(--onbrand);padding:34px 28px}.aside h2{margin:0 0 8px;font-size:1.6rem}.aside ul{padding-left:18px;margin:16px 0 0}.aside li{margin-bottom:8px}
.form-side{padding:28px}

textarea{padding:9px 11px;border:1px solid var(--line);border-radius:6px;background:var(--bg);font:inherit;font-size:16px;color:var(--ink)}
.sx{color:var(--red)}
.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.pd{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}
.trust{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.trust span,.tb span{border:1px solid var(--line);border-radius:99px;padding:3px 12px;font-size:12.5px;color:var(--mute)}
.tb{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;background:var(--panel);border-radius:8px;padding:10px;margin-bottom:14px}
.cdw{margin-top:8px!important;font-weight:600}
.lnkh{background:none;border:0;padding:0;font:inherit;font-weight:600;text-align:left}.lnkh:hover{color:var(--brand-ink,var(--brand))}
.card{transition:transform .15s,box-shadow .15s}.card:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.12)}
@media (prefers-reduced-motion:reduce){.card,.card:hover{transition:none;transform:none}}
@media(max-width:760px){.pd{grid-template-columns:1fr}}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin-bottom:14px}

.ub{background:var(--brand);color:var(--onbrand);border-radius:99px;font-size:11px;padding:0 7px;font-weight:700}
.cp{background:var(--panel);border-radius:8px;display:flex;flex-direction:column;height:70vh}
.ch{padding:12px 14px;border-bottom:1px solid var(--line);font-weight:700}
#msgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
.bubble{max-width:78%;padding:8px 12px;border-radius:14px;background:var(--bg);overflow-wrap:anywhere}

.cf{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}.cf input{flex:1}
@keyframes fu{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes dash{to{stroke-dashoffset:0}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes growx{from{width:0}}
@keyframes flow{0%,100%{background-position:0 50%}50%{background-position:100% 50%}}
@keyframes popin{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:no-preference){
#app>*{animation:fu .35s ease backwards}
.card,.kpi,.chart{animation:fu .4s ease backwards}
.hero,.dh{background-size:200% 200%;animation:flow 14s ease infinite}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:dash 1.1s ease .1s forwards}

.cbar{transform-box:fill-box;transform-origin:50% 100%;animation:grow .6s cubic-bezier(.2,.8,.2,1) backwards}
.hb2 .tr i{animation:growx .8s cubic-bezier(.2,.8,.2,1) backwards}
.seg{animation:fu .8s ease backwards}
.bubble{animation:popin .2s ease backwards}
.btn:active,.sb:active{transform:scale(.97)}
}
@media(max-width:760px){.chat{grid-template-columns:1fr}.chat.open .tl{display:none}.chat:not(.open) .cp{display:none}.cp{height:75vh}}
/* professional dashboard shell */
:root{--bg:#f3f5f9;--line:#e5e9f0;--sh:0 1px 2px rgba(16,24,40,.05),0 8px 20px rgba(16,24,40,.05);--side:#0f1729}

.isdash main{max-width:1360px}

.ni{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:none;border:0;color:#b6c2d6;padding:10px 12px;border-radius:10px;position:relative;font-weight:600;transition:background .15s,color .15s}

const SETUP_SQL="-- Sokoni marketplace: Supabase schema (run once in Dashboard > SQL Editor)\n-- Safe to re-run: uses IF NOT EXISTS / OR REPLACE where possible.\n\ncreate extension if not exists pgcrypto;\n\ndo $$ begin\n  create type public.user_role as enum ('customer','retailer','admin','finance','logistics');\nexception when duplicate_object then null; end $$;\n\n-- ───────── Tables ─────────\ncreate table if not exists public.profiles (\n  id uuid primary key references auth.users(id) on delete cascade,\n  role public.user_role not null default 'customer',\n  approved boolean not null default false,        -- retailers need admin approval\n  name text, phone text, email text,\n  id_number text, county text, subcounty text, ward text, location text, landmark text,\n  shop_name text, accent text,\n  created_at timestamptz not null default now()\n);\n\ncreate table if not exists public.products (\n  id uuid primary key default gen_random_uuid(),\n  seller_id uuid not null references public.profiles(id) on delete cascade,\n  name text not null, category text not null,\n  price int not null check (price >= 0), old_price int,\n  stock int not null default 0 check (stock >= 0),\n  emoji text, description text, brand text, warranty text,\n  images text[] not null default '{}',\n  highlights text[] not null default '{}',\n  specs jsonb not null default '[]',\n  options jsonb not null default '[]',            -- [{\"n\":\"Size\",\"o\":[\"S\",\"M\"]}]\n  hidden boolean not null default false,\n  created_at timestamptz not null default now()\n);\n\ncreate table if not exists public.orders (\n  id bigint generated always as identity (start with 100001) primary key,   -- shown as SK-<id>\n  customer_id uuid not null references public.profiles(id),\n  name text, phone text,\n  subtotal int not null default 0, fee int not null default 0, total int not null default 0,\n  method text check (method in ('door','pickup')),\n  county text, address text,\n  pay text check (pay in ('mpesa','pod','card')),\n  mpesa_code text,\n  payment_status text not null default 'pending' check (payment_status in ('pending','approved','rejected')),\n  status text not null default 'Placed' check (status in ('Placed','Packed','Dispatched','Delivered')),\n  rider text,\n  created_at timestamptz not null default now()\n);\n\ncreate table if not exists public.order_lines (\n  id bigint generated always as identity primary key,\n  order_id bigint not null references public.orders(id) on delete cascade,\n  product_id uuid references public.products(id) on delete set null,\n  seller_id uuid not null references public.profiles(id),\n  name text not null, qty int not null check (qty > 0), price int not null\n);\n\ncreate table if not exists public.reviews (\n  id bigint generated always as identity primary key,\n  product_id uuid not null references public.products(id) on delete cascade,\n  user_id uuid not null references public.profiles(id) on delete cascade,\n  author text, stars int not null check (stars between 1 and 5), body text,\n  created_at timestamptz not null default now(),\n  unique (product_id, user_id)\n);\n\ncreate table if not exists public.addresses (\n  id uuid primary key default gen_random_uuid(),\n  user_id uuid not null references public.profiles(id) on delete cascade,\n  label text not null, county text, subcounty text, ward text, location text, landmark text,\n  created_at timestamptz not null default now()\n);\n\ncreate table if not exists public.payouts (\n  id bigint generated always as identity primary key,\n  seller_id uuid not null references public.profiles(id),\n  amount int not null check (amount >= 0),\n  status text not null default 'pending' check (status in ('pending','paid')),\n  created_at timestamptz not null default now()\n);\n\ncreate table if not exists public.messages (\n  id bigint generated always as identity primary key,\n  from_id uuid not null references public.profiles(id) on delete cascade,\n  to_id uuid not null references public.profiles(id) on delete cascade,\n  product_id uuid references public.products(id) on delete set null,\n  body text not null check (length(body) <= 1000),\n  created_at timestamptz not null default now()\n);\n\ncreate index if not exists products_seller_idx on public.products(seller_id);\ncreate index if not exists order_lines_order_idx on public.order_lines(order_id);\ncreate index if not exists order_lines_seller_idx on public.order_lines(seller_id);\ncreate index if not exists reviews_product_idx on public.reviews(product_id);\n\n-- ───────── Helper functions (SECURITY DEFINER avoids RLS recursion) ─────────\ncreate or replace function public.my_role() returns public.user_role\nlanguage sql stable security definer set search_path = public as\n$$ select role from public.profiles where id = auth.uid() $$;\n\ncreate or replace function public.is_staff() returns boolean\nlanguage sql stable security definer set search_path = public as\n$$ select coalesce(public.my_role() in ('admin','finance','logistics'), false) $$;\n\ncreate or replace function public.seller_approved(uid uuid) returns boolean\nlanguage sql stable security definer set search_path = public as\n$$ select coalesce((select approved and role = 'retailer' from public.profiles where id = uid), false) $$;\n\ncreate or replace function public.owns_order(o bigint) returns boolean\nlanguage sql stable security definer set search_path = public as\n$$ select exists (select 1 from public.orders where id = o and customer_id = auth.uid()) $$;\n\ncreate or replace function public.sells_in_order(o bigint) returns boolean\nlanguage sql stable security definer set search_path = public as\n$$ select exists (select 1 from public.order_lines where order_id = o and seller_id = auth.uid()) $$;\n\n-- ───────── New user -> profile (role can only be customer or retailer at sign-up) ─────────\ncreate or replace function public.handle_new_user() returns trigger\nlanguage plpgsql security definer set search_path = public as $$\ndeclare r public.user_role := case when new.raw_user_meta_data->>'role' = 'retailer' then 'retailer' else 'customer' end;\nbegin\n  insert into public.profiles (id, role, approved, name, phone, email, shop_name)\n  values (new.id, r, (r = 'customer'), new.raw_user_meta_data->>'name', new.raw_user_meta_data->>'phone',\n          new.email, new.raw_user_meta_data->>'shop_name');\n  return new;\nend $$;\ndrop trigger if exists on_auth_user_created on auth.users;\ncreate trigger on_auth_user_created after insert on auth.users\n  for each row execute function public.handle_new_user();\n\n-- Review author comes from the profile, not the client\ncreate or replace function public.set_review_author() returns trigger\nlanguage plpgsql security definer set search_path = public as $$\nbegin\n  new.author := coalesce((select name from public.profiles where id = new.user_id), 'Customer');\n  return new;\nend $$;\ndrop trigger if exists reviews_author on public.reviews;\ncreate trigger reviews_author before insert on public.reviews\n  for each row execute function public.set_review_author();\n\n-- ───────── Public shop names (no private profile data) ─────────\ncreate or replace view public.shops as\n  select id, shop_name from public.profiles where role = 'retailer' and approved;\ngrant select on public.shops to anon, authenticated;\n\n-- ───────── Row level security ─────────\nalter table public.profiles    enable row level security;\nalter table public.products    enable row level security;\nalter table public.orders      enable row level security;\nalter table public.order_lines enable row level security;\nalter table public.reviews     enable row level security;\nalter table public.addresses   enable row level security;\nalter table public.payouts     enable row level security;\nalter table public.messages    enable row level security;\n\n-- profiles: see/edit only your own (staff can read all). Role and approval are never client-editable.\ndrop policy if exists profiles_select on public.profiles;\ncreate policy profiles_select on public.profiles for select to authenticated\n  using (id = auth.uid() or public.is_staff());\ndrop policy if exists profiles_update on public.profiles;\ncreate policy profiles_update on public.profiles for update to authenticated\n  using (id = auth.uid()) with check (id = auth.uid());\nrevoke insert, delete on public.profiles from anon, authenticated;\nrevoke update on public.profiles from anon, authenticated;\ngrant update (name, phone, id_number, county, subcounty, ward, location, landmark, shop_name, accent)\n  on public.profiles to authenticated;\n\n-- products\ndrop policy if exists products_select on public.products;\ncreate policy products_select on public.products for select to anon, authenticated\n  using ((not hidden and public.seller_approved(seller_id)) or seller_id = auth.uid() or public.my_role() = 'admin');\ndrop policy if exists products_insert on public.products;\ncreate policy products_insert on public.products for insert to authenticated\n  with check (seller_id = auth.uid() and public.my_role() = 'retailer' and public.seller_approved(auth.uid()));\ndrop policy if exists products_update on public.products;\ncreate policy products_update on public.products for update to authenticated\n  using (seller_id = auth.uid() or public.my_role() = 'admin')\n  with check (seller_id = auth.uid() or public.my_role() = 'admin');\ndrop policy if exists products_delete on public.products;\ncreate policy products_delete on public.products for delete to authenticated\n  using (seller_id = auth.uid() or public.my_role() = 'admin');\n\n-- orders and lines: written only through place_order(); read by owner, seller of a line, or staff\ndrop policy if exists orders_select on public.orders;\ncreate policy orders_select on public.orders for select to authenticated\n  using (customer_id = auth.uid() or public.is_staff() or public.sells_in_order(id));\ndrop policy if exists lines_select on public.order_lines;\ncreate policy lines_select on public.order_lines for select to authenticated\n  using (seller_id = auth.uid() or public.is_staff() or public.owns_order(order_id));\nrevoke insert, update, delete on public.orders, public.order_lines from anon, authenticated;\n\n-- reviews: public read; only buyers of a delivered order can review, once per product\ndrop policy if exists reviews_select on public.reviews;\ncreate policy reviews_select on public.reviews for select to anon, authenticated using (true);\ndrop policy if exists reviews_insert on public.reviews;\ncreate policy reviews_insert on public.reviews for insert to authenticated\n  with check (user_id = auth.uid() and exists (\n    select 1 from public.order_lines ol join public.orders o on o.id = ol.order_id\n    where ol.product_id = reviews.product_id and o.customer_id = auth.uid() and o.status = 'Delivered'));\ndrop policy if exists reviews_delete on public.reviews;\ncreate policy reviews_delete on public.reviews for delete to authenticated\n  using (user_id = auth.uid() or public.my_role() = 'admin');\n\n-- address book\ndrop policy if exists addresses_all on public.addresses;\ncreate policy addresses_all on public.addresses for all to authenticated\n  using (user_id = auth.uid()) with check (user_id = auth.uid());\n\n-- payouts: seller reads own; finance/admin manage\ndrop policy if exists payouts_select on public.payouts;\ncreate policy payouts_select on public.payouts for select to authenticated\n  using (seller_id = auth.uid() or public.my_role() in ('admin','finance'));\ndrop policy if exists payouts_write on public.payouts;\ncreate policy payouts_write on public.payouts for all to authenticated\n  using (public.my_role() in ('admin','finance')) with check (public.my_role() in ('admin','finance'));\n\n-- messages: participants only\ndrop policy if exists messages_select on public.messages;\ncreate policy messages_select on public.messages for select to authenticated\n  using (from_id = auth.uid() or to_id = auth.uid());\ndrop policy if exists messages_insert on public.messages;\ncreate policy messages_insert on public.messages for insert to authenticated\n  with check (from_id = auth.uid());\n\n-- ───────── Server-side actions ─────────\n-- Place an order. Prices and stock come from the database, never from the browser.\n-- NOTE: p_fee is taken from the page; move your delivery-fee rules here before launch.\ncreate or replace function public.place_order(\n  p_lines jsonb, p_method text, p_county text, p_address text,\n  p_pay text, p_code text, p_fee int\n) returns bigint language plpgsql security definer set search_path = public as $$\ndeclare\n  v_uid uuid := auth.uid(); prof public.profiles%rowtype; pr public.products%rowtype;\n  v_order bigint; v_sub int := 0; l jsonb; v_qty int;\nbegin\n  if v_uid is null then raise exception 'Sign in required'; end if;\n  select * into prof from public.profiles where id = v_uid;\n  if prof.role <> 'customer' then raise exception 'Customers only'; end if;\n  if jsonb_array_length(p_lines) = 0 then raise exception 'Cart is empty'; end if;\n\n  insert into public.orders (customer_id, name, phone, fee, method, county, address, pay, mpesa_code, payment_status)\n  values (v_uid, prof.name, prof.phone, greatest(coalesce(p_fee,0),0), p_method, p_county, p_address,\n          p_pay, p_code, case when p_pay = 'mpesa' then 'pending' else 'approved' end)\n  returning id into v_order;\n\n  for l in select value from jsonb_array_elements(p_lines) loop\n    v_qty := (l->>'qty')::int;\n    if v_qty is null or v_qty <= 0 then raise exception 'Bad quantity'; end if;\n    select * into pr from public.products where id = (l->>'product_id')::uuid and not hidden for update;\n    if not found or not public.seller_approved(pr.seller_id) then raise exception 'Product unavailable'; end if;\n    if pr.stock < v_qty then raise exception 'Not enough stock for %', pr.name; end if;\n    update public.products set stock = stock - v_qty where id = pr.id;\n    insert into public.order_lines (order_id, product_id, seller_id, name, qty, price)\n    values (v_order, pr.id, pr.seller_id, pr.name || coalesce(' (' || nullif(l->>'options','') || ')', ''), v_qty, pr.price);\n    v_sub := v_sub + pr.price * v_qty;\n  end loop;\n  if p_pay <> 'mpesa' and v_sub + greatest(coalesce(p_fee,0),0) > 5000 then raise exception 'Orders above KSh 5,000 must be paid by M-Pesa first'; end if;\n\n  update public.orders set subtotal = v_sub, total = v_sub + fee where id = v_order;\n  return v_order;\nend $$;\nrevoke all on function public.place_order(jsonb,text,text,text,text,text,int) from public, anon;\ngrant execute on function public.place_order(jsonb,text,text,text,text,text,int) to authenticated;\n\ncreate or replace function public.set_order_status(p_order bigint, p_status text) returns void\nlanguage plpgsql security definer set search_path = public as $$\nbegin\n  if p_status not in ('Placed','Packed','Dispatched','Delivered') then raise exception 'Bad status'; end if;\n  if p_status <> 'Placed' and exists (select 1 from public.orders where id = p_order and payment_status <> 'approved') then raise exception 'Payment not confirmed yet'; end if;\n  if public.my_role() in ('admin','logistics')\n     or (public.my_role() = 'retailer' and public.sells_in_order(p_order)) then\n    update public.orders set status = p_status where id = p_order;\n  else raise exception 'Not allowed'; end if;\nend $$;\n\ncreate or replace function public.set_payment_status(p_order bigint, p_status text) returns void\nlanguage plpgsql security definer set search_path = public as $$\nbegin\n  if p_status not in ('pending','approved','rejected') then raise exception 'Bad status'; end if;\n  if public.my_role() not in ('admin','finance') then raise exception 'Not allowed'; end if;\n  update public.orders set payment_status = p_status where id = p_order;\nend $$;\n\ncreate or replace function public.admin_set_user(p_user uuid, p_role public.user_role, p_approved boolean) returns void\nlanguage plpgsql security definer set search_path = public as $$\nbegin\n  if public.my_role() <> 'admin' then raise exception 'Not allowed'; end if;\n  update public.profiles set role = p_role, approved = p_approved where id = p_user;\nend $$;\n\nrevoke all on function public.set_order_status(bigint,text), public.set_payment_status(bigint,text),\n  public.admin_set_user(uuid,public.user_role,boolean) from public, anon;\ngrant execute on function public.set_order_status(bigint,text), public.set_payment_status(bigint,text),\n  public.admin_set_user(uuid,public.user_role,boolean) to authenticated;\n\n-- ───────── Storage: product photos (public read, sellers write to their own folder) ─────────\ninsert into storage.buckets (id, name, public) values ('product-images', 'product-images', true)\non conflict (id) do nothing;\n\ndrop policy if exists \"product images public read\" on storage.objects;\ncreate policy \"product images public read\" on storage.objects for select\n  using (bucket_id = 'product-images');\ndrop policy if exists \"product images seller upload\" on storage.objects;\ncreate policy \"product images seller upload\" on storage.objects for insert to authenticated\n  with check (bucket_id = 'product-images' and (storage.foldername(name))[1] = auth.uid()::text\n              and public.my_role() = 'retailer');\ndrop policy if exists \"product images seller modify\" on storage.objects;\ncreate policy \"product images seller modify\" on storage.objects for update to authenticated\n  using (bucket_id = 'product-images' and (storage.foldername(name))[1] = auth.uid()::text);\ndrop policy if exists \"product images seller delete\" on storage.objects;\ncreate policy \"product images seller delete\" on storage.objects for delete to authenticated\n  using (bucket_id = 'product-images' and (storage.foldername(name))[1] = auth.uid()::text);\n\n-- ───────── After you sign up in the app, make yourself the first admin ─────────\n-- update public.profiles set role = 'admin', approved = true where email = 'YOUR_EMAIL_HERE';\n\n-- Sokoni: storage buckets and KYC (run AFTER sokoni-supabase-schema.sql, in SQL Editor)\n-- Creates all buckets automatically. Safe to re-run.\n--\n-- File path convention used by the page:  <user-id>/<file-name>\n--   product-images/<seller-id>/<product-id>-1.jpg\n--   kyc-documents/<user-id>/national_id-<timestamp>.pdf\n\n-- ───────── Buckets ─────────\ninsert into storage.buckets (id, name, public, file_size_limit, allowed_mime_types) values\n  ('product-images', 'product-images', true,  5242880, array['image/jpeg','image/png','image/webp']),\n  ('shop-assets',    'shop-assets',    true,  3145728, array['image/jpeg','image/png','image/webp']),\n  ('review-photos',  'review-photos',  true,  4194304, array['image/jpeg','image/png','image/webp']),\n  ('kyc-documents',  'kyc-documents',  false, 8388608, array['image/jpeg','image/png','application/pdf'])\non conflict (id) do update set\n  public = excluded.public,\n  file_size_limit = excluded.file_size_limit,\n  allowed_mime_types = excluded.allowed_mime_types;\n\n-- ───────── shop-assets (logos, banners): public read, approved sellers write to own folder ─────────\ndrop policy if exists \"shop assets read\" on storage.objects;\ncreate policy \"shop assets read\" on storage.objects for select using (bucket_id = 'shop-assets');\ndrop policy if exists \"shop assets write\" on storage.objects;\ncreate policy \"shop assets write\" on storage.objects for insert to authenticated\n  with check (bucket_id = 'shop-assets' and (storage.foldername(name))[1] = auth.uid()::text\n              and public.my_role() = 'retailer');\ndrop policy if exists \"shop assets modify\" on storage.objects;\ncreate policy \"shop assets modify\" on storage.objects for update to authenticated\n  using (bucket_id = 'shop-assets' and (storage.foldername(name))[1] = auth.uid()::text);\ndrop policy if exists \"shop assets delete\" on storage.objects;\ncreate policy \"shop assets delete\" on storage.objects for delete to authenticated\n  using (bucket_id = 'shop-assets' and (storage.foldername(name))[1] = auth.uid()::text);\n\n-- ───────── review-photos: public read, any signed-in user writes to own folder ─────────\ndrop policy if exists \"review photos read\" on storage.objects;\ncreate policy \"review photos read\" on storage.objects for select using (bucket_id = 'review-photos');\ndrop policy if exists \"review photos write\" on storage.objects;\ncreate policy \"review photos write\" on storage.objects for insert to authenticated\n  with check (bucket_id = 'review-photos' and (storage.foldername(name))[1] = auth.uid()::text);\ndrop policy if exists \"review photos delete\" on storage.objects;\ncreate policy \"review photos delete\" on storage.objects for delete to authenticated\n  using (bucket_id = 'review-photos' and ((storage.foldername(name))[1] = auth.uid()::text or public.my_role() = 'admin'));\n\n-- ───────── kyc-documents: PRIVATE. Owner uploads and reads own files; admin reads and deletes all ─────────\ndrop policy if exists \"kyc upload own\" on storage.objects;\ncreate policy \"kyc upload own\" on storage.objects for insert to authenticated\n  with check (bucket_id = 'kyc-documents' and (storage.foldername(name))[1] = auth.uid()::text);\ndrop policy if exists \"kyc read own or admin\" on storage.objects;\ncreate policy \"kyc read own or admin\" on storage.objects for select to authenticated\n  using (bucket_id = 'kyc-documents'\n         and ((storage.foldername(name))[1] = auth.uid()::text or public.my_role() = 'admin'));\ndrop policy if exists \"kyc admin delete\" on storage.objects;\ncreate policy \"kyc admin delete\" on storage.objects for delete to authenticated\n  using (bucket_id = 'kyc-documents' and public.my_role() = 'admin');\n\n-- ───────── KYC records: one row per uploaded document ─────────\ncreate table if not exists public.kyc_documents (\n  id uuid primary key default gen_random_uuid(),\n  user_id uuid not null references public.profiles(id) on delete cascade,\n  doc_type text not null check (doc_type in\n    ('national_id','passport','business_registration','kra_pin','bank_or_mpesa_proof')),\n  file_path text not null,\n  status text not null default 'pending' check (status in ('pending','approved','rejected')),\n  note text,\n  reviewed_by uuid references public.profiles(id),\n  reviewed_at timestamptz,\n  created_at timestamptz not null default now(),\n  check (split_part(file_path, '/', 1) = user_id::text)\n);\ncreate index if not exists kyc_user_idx on public.kyc_documents(user_id);\nalter table public.kyc_documents enable row level security;\n\ndrop policy if exists kyc_select on public.kyc_documents;\ncreate policy kyc_select on public.kyc_documents for select to authenticated\n  using (user_id = auth.uid() or public.my_role() = 'admin');\ndrop policy if exists kyc_insert on public.kyc_documents;\ncreate policy kyc_insert on public.kyc_documents for insert to authenticated\n  with check (user_id = auth.uid() and status = 'pending');\nrevoke update, delete on public.kyc_documents from anon, authenticated;\n\n-- Admin decision on one document\ncreate or replace function public.review_kyc(p_doc uuid, p_status text, p_note text default null)\nreturns void language plpgsql security definer set search_path = public as $$\nbegin\n  if public.my_role() <> 'admin' then raise exception 'Not allowed'; end if;\n  if p_status not in ('approved','rejected') then raise exception 'Bad status'; end if;\n  update public.kyc_documents\n     set status = p_status, note = p_note, reviewed_by = auth.uid(), reviewed_at = now()\n   where id = p_doc;\nend $$;\nrevoke all on function public.review_kyc(uuid, text, text) from public, anon;\ngrant execute on function public.review_kyc(uuid, text, text) to authenticated;\n\n-- Automatic seller approval: once ID, business registration and KRA PIN are all approved\ncreate or replace function public.kyc_auto_approve() returns trigger\nlanguage plpgsql security definer set search_path = public as $$\nbegin\n  if (select role from public.profiles where id = new.user_id) = 'retailer'\n     and (select count(distinct doc_type) from public.kyc_documents\n           where user_id = new.user_id and status = 'approved'\n             and doc_type in ('national_id','business_registration','kra_pin')) = 3\n  then\n    update public.profiles set approved = true where id = new.user_id;\n  end if;\n  return new;\nend $$;\ndrop trigger if exists kyc_approved on public.kyc_documents;\ncreate trigger kyc_approved after update of status on public.kyc_documents\n  for each row when (new.status = 'approved') execute function public.kyc_auto_approve();\n\n-- Sokoni: one account per national ID number (run after 001 and 002; safe to re-run)\n\n-- Only digits, 7 to 9 long (matches the page's check)\ndo $$ begin\n  alter table public.profiles add constraint profiles_id_number_format\n    check (id_number is null or id_number = '' or id_number ~ '^[0-9]{7,9}$');\nexception when duplicate_object then null; end $$;\n\n-- No two profiles may share an ID number\ncreate unique index if not exists profiles_id_number_key\n  on public.profiles (id_number) where id_number is not null and id_number <> '';\n\n-- Pre-check used by sign-up: true if another account already has this ID number.\n-- Returns only yes/no, never who owns it.\ncreate or replace function public.id_number_taken(p_id text) returns boolean\nlanguage sql stable security definer set search_path = public as $$\n  select exists (\n    select 1 from public.profiles\n     where id_number = p_id\n       and id <> coalesce(auth.uid(), '00000000-0000-0000-0000-000000000000'::uuid)\n  )\n$$;\ngrant execute on function public.id_number_taken(text) to anon, authenticated;\n";
var DBS={st:'unknown',msg:''};
const dbcheck=async()=>{DBS.st='checking';try{const r=await fetch(SB_URL+'/rest/v1/shops?select=id&limit=1',{headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY}});DBS.st=r.ok?'ready':(r.status===404?'missing':'error')}catch(e){DBS.st='offline'}if(V==='dbsetup')render()};
VIEWS.dbsetup=()=>{const m={unknown:'Not checked yet.',checking:'Checking...',ready:'Database is set up. Tables, security rules and storage buckets exist.',missing:'Database is not set up yet.',offline:'Could not reach Supabase. Check your connection.',error:'Supabase returned an error. Check the project keys.'}[DBS.st];return '<h2>Database setup</h2><div class="box"><p><b>'+esc(m)+'</b></p>'+(DBS.msg?'<p role="status">'+esc(DBS.msg)+'</p>':'')+'<button class="sb" style="min-height:44px" data-act="dbcheck">Check again</button></div><h3 style="margin-top:18px">Create schema and storage</h3><div class="box"><p class="mute">Paste a Supabase access token (supabase.com/dashboard/account/tokens). It is used once from this page and is never saved or placed in this file. Delete it afterwards.</p><label>Access token<input id="sbt" type="password" autocomplete="off" placeholder="sbp_..." style="width:100%"></label><div class="row" style="gap:8px;margin-top:10px"><button class="sb" style="min-height:44px" data-act="dbrun">Create now</button></div><p class="mute" style="margin-top:12px">If your browser blocks the request, use these instead:</p><div class="row" style="gap:8px;flex-wrap:wrap"><button class="sb ghost" style="min-height:44px" data-act="dbcopy">Copy setup SQL</button><a class="sb ghost" style="min-height:44px;display:inline-flex;align-items:center" target="_blank" rel="noopener" href="https://supabase.com/dashboard/project/'+SB_REF+'/sql/new">Open SQL Editor</a></div></div>'};
ACT.dbcheck=dbcheck;ACT.dbopen=()=>go('dbsetup');
ACT.dbcopy=()=>{if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(SETUP_SQL).then(()=>toast('Setup SQL copied'),()=>toast('Copy failed'));else toast('Copy not supported here')};
ACT.dbrun=async()=>{const t=(($('#sbt')||{}).value||'').trim();toast('Run the setup SQL in the Supabase dashboard instead');return;DBS.msg='Creating schema and storage...';render();try{const r=await fetch('https://api.supabase.com/v1/projects/'+SB_REF+'/database/query',{method:'POST',headers:{Authorization:'Bearer '+t,'Content-Type':'application/json'},body:JSON.stringify({query:SETUP_SQL+"\nnotify pgrst, 'reload schema';"})});const x=await r.text();DBS.msg=r.ok?'Done. Schema, storage buckets and triggers were created.':'Supabase said: '+x.slice(0,300)}catch(e){DBS.msg='Your browser blocked the request. Use Copy setup SQL and Open SQL Editor instead.'}render();dbcheck()};
if(location.hash==='#dbsetup')V='dbsetup';

var OTPS={step:1,email:'',msg:'',last:0},SBSESS=null;
const sbAuth=async(path,body)=>{try{const r=await fetch(SB_URL+'/auth/v1/'+path,{method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});let j={};try{j=await r.json()}catch(e){}return{ok:r.ok,st:r.status,j}}catch(e){return{ok:false,st:0,j:{}}}};
const otpErr=r=>r.st===0?'Could not reach the server. Check your connection.':r.st===429?'Too many requests. Wait a minute and try again.':(r.j.msg||r.j.error_description||'Something went wrong. Try again.');
VIEWS.otp=()=>OTPS.step===1?'<h2>Sign in with email code</h2><div class="box"><p class="mute">We email you a 6-digit code. No password needed. New emails get a customer account.</p><form class="form" data-f="otpsend" novalidate><label>Email<input name="email" type="email" required autocomplete="email" inputmode="email"></label>'+(OTPS.msg?'<div class="err" role="alert">'+esc(OTPS.msg)+'</div>':'')+'<button class="btn">Send code</button></form></div>':'<h2>Enter your code</h2><div class="box"><p class="mute">We sent a 6-digit code to <b>'+esc(OTPS.email)+'</b>. It expires in a few minutes.</p><form class="form" data-f="otpverify" novalidate><label>Code<input name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required style="letter-spacing:.4em;font-size:22px;text-align:center"></label>'+(OTPS.msg?'<div class="err" role="alert">'+esc(OTPS.msg)+'</div>':'')+'<button class="btn">Verify and sign in</button></form><div class="row" style="gap:8px;margin-top:10px"><button class="sb ghost" style="min-height:44px" data-act="otpresend">Resend code</button><button class="sb ghost" style="min-height:44px" data-act="otpback">Use another email</button></div></div>';
FORM.otpsend=async d=>{const em=(d.get('email')||'').trim().toLowerCase();if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){OTPS.msg='Enter a valid email address.';return render()}OTPS.msg='Sending...';render();const r=await sbAuth('otp',{email:em,create_user:true});if(r.ok){OTPS={step:2,email:em,msg:'',last:Date.now()}}else OTPS.msg=otpErr(r);render()};
FORM.otpverify=async d=>{const c=(d.get('code')||'').replace(/\D/g,'');if(c.length!==6){OTPS.msg='Enter the 6-digit code.';return render()}OTPS.msg='Checking...';render();const r=await sbAuth('verify',{type:'email',email:OTPS.email,token:c});if(!(r.ok&&r.j.access_token)){OTPS.msg=r.st===0||r.st===429?otpErr(r):'That code is wrong or has expired.';return render()}SBSESS={at:r.j.access_token,rt:r.j.refresh_token};const em=OTPS.email;let u=S.users.find(x=>(x.email||'').toLowerCase()===em);if(!u){u={id:'u'+uid(),role:'customer',name:em.split('@')[0],email:em,h:'',mustChange:false};S.users.push(u)}S.me=u.id;SESS=false;OTPS={step:1,email:'',msg:'',last:0};LASTACT=Date.now();save();after()};
ACT.otp=()=>{OTPS={step:1,email:'',msg:'',last:0};go('otp')};
ACT.otpback=()=>{OTPS.step=1;OTPS.msg='';render()};
ACT.otpresend=async()=>{if(Date.now()-OTPS.last<30000)return toast('Wait a few seconds before resending');const r=await sbAuth('otp',{email:OTPS.email,create_user:true});if(r.ok){OTPS.last=Date.now();toast('Code sent')}else toast(otpErr(r))};
/* Tier 3-4 (browser-side): support tickets, Q&A, loyalty, referrals, shop pages, bulk CSV upload */
const isStaff=u=>!!u&&['admin','finance','logistics'].includes(u.role);
const TK=()=>S.tickets||(S.tickets=[]),QA=()=>S.qa||(S.qa=[]);
const tkHtml=(t,u)=>{const over=t.status==='Open'&&!t.replies.some(r=>r.staff)&&Date.now()-t.ts>864e5,ow=S.users.find(x=>x.id===t.uid)||{};return '<div class="box" style="margin-bottom:12px"><div class="row" style="justify-content:space-between;gap:8px"><b>'+esc(t.subject)+'</b><span class="mute">'+t.status+(over?' · overdue':'')+'</span></div><p class="mute">'+(isStaff(u)?esc(ow.name||'Customer')+' · ':'')+new Date(t.ts).toLocaleDateString('en-KE')+(t.order?' · Order '+esc(t.order):'')+'</p><p>'+esc(t.msg)+'</p>'+t.replies.map(r=>'<p style="border-left:3px solid var(--brand);padding-left:8px"><b>'+(r.staff?'Support':esc(r.name))+':</b> '+esc(r.txt)+'</p>').join('')+(t.status==='Open'?'<form class="form" data-f="replyticket" novalidate><input type="hidden" name="tid" value="'+esc(t.id)+'"><label>Reply<input name="txt" maxlength="500"></label><div class="row" style="gap:8px"><button class="sb" style="min-height:44px">Send</button><button type="button" class="sb ghost" style="min-height:44px" data-act="closeticket" data-id="'+esc(t.id)+'">Close ticket</button></div></form>':'')+'</div>'};
VIEWS.support=()=>{const u=me();if(!u)return '<h2>Support</h2><div class="box"><p>Sign in to contact support or see your tickets.</p><button class="btn" data-act="login">Sign in</button></div>';const all=TK().slice().sort((a,b)=>b.ts-a.ts),l=isStaff(u)?all:all.filter(t=>t.uid===u.id);return '<h2>Support</h2><p class="mute">We aim to reply within 24 hours.</p>'+(isStaff(u)?'':'<div class="box"><form class="form" data-f="newticket" novalidate><label>Subject<input name="subject" maxlength="80"></label><label>Order number (optional)<input name="order" maxlength="20" placeholder="SK-100001"></label><label>Message<textarea name="msg" rows="4" maxlength="1000" style="width:100%"></textarea></label><button class="btn">Send to support</button></form></div>')+'<h3 style="margin-top:18px">'+(isStaff(u)?'All tickets':'Your tickets')+'</h3>'+(l.length?l.map(t=>tkHtml(t,u)).join(''):'<p class="mute">No tickets yet.</p>')};
FORM.newticket=d=>{const u=me(),g=k=>(d.get(k)||'').trim();if(!u)return;if(!g('subject')||!g('msg'))return toast('Add a subject and a message.');TK().push({id:'t'+uid(),uid:u.id,subject:g('subject'),msg:g('msg'),order:g('order'),ts:Date.now(),status:'Open',replies:[]});save();render();toast('Ticket sent')};
FORM.replyticket=d=>{const u=me(),t=TK().find(x=>x.id===d.get('tid')),txt=(d.get('txt')||'').trim();if(!u||!t||!txt||(!isStaff(u)&&t.uid!==u.id))return;t.replies.push({name:u.name,staff:isStaff(u),txt,ts:Date.now()});save();render()};
ACT.closeticket=id=>{const u=me(),t=TK().find(x=>x.id===id);if(!u||!t||(!isStaff(u)&&t.uid!==u.id))return;t.status='Closed';save();render()};
ACT.support=()=>go('support');
const _hp=VIEWS.help;VIEWS.help=()=>_hp()+'<div class="box" style="margin-top:12px"><b>Still need help?</b><br><button class="sb" style="min-height:44px;margin-top:8px" data-act="support">Contact support</button></div>';
const qaBox=p=>{const u=me(),l=QA().filter(q=>q.pid===p.id).sort((a,b)=>b.ts-a.ts),can=u&&(u.id===p.s||isStaff(u));return '<h3 style="margin-top:22px">Questions and answers</h3><div class="box">'+(l.length?l.map(q=>'<div style="margin-bottom:12px"><b>Q: '+esc(q.q)+'</b><br><small class="mute">'+esc(q.name)+'</small>'+(q.a?'<p style="border-left:3px solid var(--brand);padding-left:8px"><b>Seller:</b> '+esc(q.a)+'</p>':(can?'<form class="form" data-f="ansq" novalidate><input type="hidden" name="qid" value="'+esc(q.id)+'"><label>Answer<input name="a" maxlength="400"></label><button class="sb" style="min-height:44px">Post answer</button></form>':'<p class="mute">Waiting for the seller.</p>'))+'</div>').join(''):'<p class="mute">No questions yet.</p>')+(u&&u.role==='customer'?'<form class="form" data-f="askq" novalidate><input type="hidden" name="pid" value="'+esc(p.id)+'"><label>Ask the seller<input name="q" maxlength="300" placeholder="Is it under warranty?"></label><button class="sb" style="min-height:44px">Ask</button></form>':(u?'':'<p class="mute">Sign in to ask a question.</p>'))+'</div>'};
